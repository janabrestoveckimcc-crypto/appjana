<!doctype html>
<html lang="hr">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>relAI · Mobile preview</title>
 <style>
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090f18}
  body{display:flex;justify-content:center;padding:20px 12px;font-family:Arial,sans-serif}
  main{width:406px;max-width:100%}
  .phone{padding:8px;background:#202c3a;border:1px solid #52677f;border-radius:34px;box-shadow:0 24px 90px #0009;overflow:hidden}
  iframe{display:block;width:100%;height:844px;max-height:calc(100dvh - 72px);border:0;border-radius:26px;background:#111c29}
  p{margin:10px 0 0;text-align:center;color:#a1b5ca;font-size:11px;letter-spacing:.5px}
  @media(max-width:430px){body{padding:0}main{width:100%}.phone{padding:0;border:0;border-radius:0}iframe{height:100dvh;max-height:none;border-radius:0}p{display:none}}
 </style>
</head>
<body><main><div class="phone"><iframe src="/" title="relAI — mobilna aplikacija"></iframe></div><p>relAI · mobile preview</p></main></body>
</html>
